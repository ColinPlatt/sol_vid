<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070708">
  <meta name="description" content="ghoulballs: Ethereum's first (probably) fully onchain animated GIF. Free mint, 1 per address, on Base.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ghoulballs</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <a class="wordmark" href="./">GHOULBALLS</a>
    <button id="connect-wallet" class="chip-button" type="button">Connect</button>
  </header>

  <main>
    <section class="machine" id="mint" aria-label="Mint">
      <div class="screen"><img id="hero-image" src="assets/seed-42.gif" alt="ghoulballs" width="512" height="512"><span class="scanlines" aria-hidden="true"></span></div>
      <div class="controls">
        <p class="tagline">Ethereum's first (probably) fully onchain animated GIF</p>
        <p id="minted-count" class="counter">— / 6,667</p>
        <button id="mint-button" class="mint-button" type="button" disabled>MINT</button>
        <p id="availability" class="availability"><span id="availability-text">FREE</span></p>
        <div id="mint-status" class="mint-status" role="status" aria-live="polite" hidden></div>
        <a id="transaction-link" class="tx-link" target="_blank" rel="noopener noreferrer" hidden>TX ↗</a>
      </div>
    </section>

    <section class="minted" id="minted" aria-label="Minted">
      <p id="gallery-status" class="gallery-status" role="status" aria-live="polite"><span id="gallery-status-text"></span></p>
      <div id="gallery-versions"></div>
    </section>
  </main>

  <footer class="bottom"><a id="contract-link" href="https://github.com/ColinPlatt/sol_vid" target="_blank" rel="noopener noreferrer">CONTRACT ↗</a><a href="https://github.com/ColinPlatt/sol_vid" target="_blank" rel="noopener noreferrer">SOURCE ↗</a></footer>

  <dialog id="wallet-dialog" aria-labelledby="wallet-title"><div class="dialog-top"><h2 id="wallet-title">WALLET</h2><button id="close-wallet-dialog" class="icon-button" aria-label="Close" type="button">×</button></div><div id="wallet-list"></div></dialog>
  <noscript><p class="noscript">JavaScript required.</p></noscript>
</body>
</html>
