<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block art concepts</title>
<style>
  :root { --bg: #050806; --ink: #c8f5d2; --dim: #4c6d55; --line: #1d3324; --amber: #ffb028; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 18px; letter-spacing: 3px; margin: 0 0 4px; color: var(--amber); }
  p { margin: 0 0 12px; color: var(--dim); max-width: 760px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
  button, select { font: inherit; background: #0b130e; color: var(--ink); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
  .stage { display: grid; grid-template-columns: minmax(0, 512px) minmax(0, 1fr); gap: 20px; align-items: start; }
  canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border: 1px solid var(--line); background: #000; display: block; }
  #about { color: var(--ink); }
  #meta { white-space: pre-wrap; color: var(--dim); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 24px; }
  .grid figure { margin: 0; cursor: pointer; } .grid canvas { border-color: var(--line); } .grid figcaption { color: var(--dim); font-size: 11px; padding-top: 4px; }
  @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>BLOCK ART · CONCEPTS</h1>
  <p>Concept renders in plain JavaScript, not onchain code. Each piece takes an epoch of consecutive Base blocks and
     plays one block per frame at 25fps: 50 blocks make a 2-second loop. Minting would open once per epoch.</p>
  <div class="bar" id="concepts"></div>
  <div class="bar">
    <select id="source" aria-label="Blocks">
      <option value="epoch">Snapshot: 50 consecutive blocks (busy)</option>
      <option value="live">Live: latest 50 Base blocks</option>
    </select>
    <button id="play" type="button" aria-pressed="true">PAUSE</button>
    <input id="scrub" type="range" min="0" max="49" value="0" aria-label="Frame" style="flex:1;min-width:160px">
    <span id="frame">01/50</span>
  </div>
  <div class="stage">
    <canvas id="view" width="128" height="128"></canvas>
    <div><p id="about"></p><div id="meta"></div></div>
  </div>
  <div class="grid" id="thumbs"></div>
</main>
<script type="module">
import { W, H, CONCEPTS, render } from "./concepts.js";
import { EPOCH } from "./blocks.js";

const params = new URLSearchParams(location.search);
let concept = CONCEPTS.find(c => c.id === params.get("concept")) ?? CONCEPTS[0];
let epoch = EPOCH, frame = Number(params.get("frame") ?? 0), playing = !params.has("frame");
const $ = id => document.getElementById(id);

function paint(canvas, c, f) {
  const ctx = canvas.getContext("2d");
  ctx.putImageData(new ImageData(render(c, epoch, f), W, H), 0, 0);
}
function draw() {
  paint($("view"), concept, frame);
  $("scrub").max = epoch.length - 1; $("scrub").value = frame;
  $("frame").textContent = `${String(frame + 1).padStart(2, "0")}/${epoch.length}`;
  const b = epoch[frame];
  $("meta").textContent = `block   ${Number(BigInt(b.number))}\nhash    ${b.hash}\nparent  ${b.parentHash}\ngas     ${(Number(BigInt(b.gasUsed)) / Number(BigInt(b.gasLimit)) * 100).toFixed(2)}%\ntxs     ${b.txCount}\nbasefee ${Number(BigInt(b.baseFeePerGas))} wei`;
}
function choose(c) {
  concept = c; $("about").textContent = c.about;
  for (const b of $("concepts").children) b.setAttribute("aria-pressed", String(b.dataset.id === c.id));
  draw();
}
for (const c of CONCEPTS) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = c.name; b.dataset.id = c.id;
  b.addEventListener("click", () => choose(c)); $("concepts").append(b);
}
function thumbs() {
  $("thumbs").replaceChildren(...CONCEPTS.map(c => {
    const fig = document.createElement("figure"), cv = document.createElement("canvas"), cap = document.createElement("figcaption");
    cv.width = W; cv.height = H; paint(cv, c, Math.floor(epoch.length / 2)); cap.textContent = c.name;
    fig.append(cv, cap); fig.addEventListener("click", () => choose(c)); return fig;
  }));
}
async function loadLive() {
  // Batch JSON-RPC; Base answers a one-call batch with a bare object, so normalise to a list.
  const rpc = async calls => {
    const reply = await (await fetch("https://mainnet.base.org", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(calls.map(([method, params], id) => ({ jsonrpc: "2.0", id, method, params }))) })).json();
    const list = (Array.isArray(reply) ? reply : [reply]).sort((a, b) => a.id - b.id);
    if (list.some(r => r.error || r.result == null)) throw new Error(list.find(r => r.error)?.error?.message ?? "missing result");
    return list.map(r => r.result);
  };
  const [latestHex] = await rpc([["eth_blockNumber", []]]), latest = Number(BigInt(latestHex)), blocks = [];
  // Base's public RPC allows 25 requests a second and counts each call in a batch: 10 blocks, then a pause,
  // retrying a batch that hits the limit.
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  for (let s = latest - 49; s <= latest; s += 10) {
    const calls = Array.from({ length: Math.min(10, latest - s + 1) }, (_, i) => ["eth_getBlockByNumber", ["0x" + (s + i).toString(16), false]]);
    for (let attempt = 0; ; ++attempt) {
      try { blocks.push(...await rpc(calls)); break; }
      catch (error) { if (attempt === 4 || !/limit|rate|429/i.test(error.message)) throw error; await wait(800 * (attempt + 1)); }
    }
    await wait(450);
  }
  return blocks.map(b => ({ ...b, txCount: b.transactions.length }));
}
$("source").addEventListener("change", async () => {
  if ($("source").value === "live") { try { epoch = await loadLive(); } catch (e) { alert("Could not load live blocks: " + e.message); $("source").value = "epoch"; epoch = EPOCH; } }
  else epoch = EPOCH;
  frame = 0; thumbs(); draw();
});
$("play").addEventListener("click", () => { playing = !playing; $("play").textContent = playing ? "PAUSE" : "PLAY"; $("play").setAttribute("aria-pressed", String(playing)); });
$("scrub").addEventListener("input", () => { frame = Number($("scrub").value); draw(); });
let last = 0;
(function tick(now) { if (playing && now - last >= 40) { last = now; frame = (frame + 1) % epoch.length; draw(); } requestAnimationFrame(tick); })(0);
if (!playing) { $("play").textContent = "PLAY"; $("play").setAttribute("aria-pressed", "false"); }
choose(concept); thumbs();
</script>
</body>
</html>
