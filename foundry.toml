[profile.default]
src = "src"
test = "test"
solc = "0.8.37"
# Sepolia Glamsterdam uses the Amsterdam execution-layer rules.
evm_version = "amsterdam"
# Required by solc 0.8.37 for the new Amsterdam target; SSA CFG stays disabled.
experimental = true
optimizer = true
optimizer_runs = 200
via_ir = true
gas_limit = 2000000000
fs_permissions = [{ access = "read-write", path = "./previews" }, { access = "read", path = "./fixtures/marketplace-probe" }]

# Base has its own upgrade schedule; do not inherit Sepolia Amsterdam bytecode.
[profile.base]
solc = "0.8.30"
evm_version = "cancun"
experimental = false

[profile.base_sepolia]
solc = "0.8.30"
evm_version = "cancun"
experimental = false

[fmt]
ignore = ["vendor/**"]
